<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchly live status</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f0eeea;
    --muted: #c5c5c5;
    --iris: #f0eeea;
    --iris-soft: rgba(240, 238, 234, 0.35);
    --hairline: rgba(240, 238, 234, 0.14);
    --panel: rgba(5, 5, 5, 0.55);
    --status-online: #23a55a;
    --status-idle: #f0b232;
    --status-dnd: #f23f43;
    --status-offline: #80848e;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at 28% 18%, #404040 0%, #282828 68%);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 24px 64px;
  }
  .mast { margin-bottom: 32px; }
  .frame {
    position: relative;
    border: 1px solid var(--hairline);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 22px;
    background:
      linear-gradient(rgba(32, 32, 32, .25), rgba(32, 32, 32, .5)),
      url('assets/watchly-img.jpg') center / cover no-repeat;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(240,238,234,0.05) inset;
  }
  .banner {
    position: relative;
    margin: 16px 16px 0;
    isolation: isolate;
  }
  .banner-image {
    display: block;
    width: 100%;
    aspect-ratio: 735 / 260;
    object-fit: cover;
    border-radius: 26px;
  }
  .banner-ornament {
    position: absolute;
    inset: -8px;
    width: calc(100% + 16px);
    height: calc(100% + 16px);
    overflow: visible;
    pointer-events: none;
    color: #f0eeea;
    filter: drop-shadow(0 0 3px rgba(255,255,255,.65));
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    color: var(--ink);
    text-shadow: 0 2px 24px rgba(0,0,0,0.5);
  }
  .sub {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.6;
    margin: 0;
    max-width: 40ch;
    text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  }
  .frame-body {
    padding: 22px;
  }
  .who { position: relative; display: flex; align-items: flex-end; gap: 8px; margin-top: -64px; margin-bottom: 24px; }
  .avatar-wrap { position: relative; width: clamp(88px, 23vw, 120px); height: clamp(88px, 23vw, 120px); flex-shrink: 0; }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%;
    background: #383838;
    object-fit: cover; display: block;
    border: 4px solid #383838;
  }
  .avatar-decoration {
    position: absolute;
    inset: -7.5%;
    width: 115%; height: 115%;
    object-fit: contain;
    pointer-events: none;
  }
  .who-info { min-width: 0; flex: 1; padding-bottom: 16px; }
  .last-online {
    margin: 0 0 20px;
    padding: 12px 14px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: rgba(5, 5, 5, .35);
    font-size: .75rem;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }
  .last-online-detail { display: block; color: var(--muted); font-size: .68rem; }
  .nameplate {
    position: relative;
    width: fit-content;
    max-width: calc(100% - 16px);
    min-width: min(150px, calc(100% - 16px));
    padding: 4px 15px;
    margin: 0 0 7px 4px;
    border: 1px solid #f0eeea;
    outline: 1px solid rgba(240,238,234,.5);
    outline-offset: 3px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(85,85,85,.55), rgba(60,60,60,.75));
    box-shadow: 0 0 5px rgba(240,238,234,.35), inset 0 0 5px rgba(240,238,234,.18);
    text-align: center;
  }
  .nameplate::before {
    content: '';
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(240,238,234,.5);
    border-radius: inherit;
    pointer-events: none;
  }
  .nameplate-ornament {
    position: absolute;
    top: 50%;
    width: 23px;
    height: 30px;
    color: var(--ink);
    transform: translateY(-50%);
    filter: drop-shadow(0 0 3px rgba(255,255,255,.5));
    pointer-events: none;
  }
  .nameplate-ornament.left { left: -12px; }
  .nameplate-ornament.right { right: -12px; transform: translateY(-50%) scaleX(-1); }
  .nameplate-crest { position: absolute; left: 50%; width: 24px; height: 14px; transform: translateX(-50%); color: var(--ink); pointer-events: none; filter: drop-shadow(0 0 2px rgba(255,255,255,.5)); }
  .nameplate-crest.top { top: -11px; }
  .nameplate-crest.bottom { bottom: -11px; transform: translateX(-50%) scaleY(-1); }
  .nameplate-content { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .nameplate-discord { width: 19px; height: 19px; flex: 0 0 19px; color: var(--ink); padding-right: 5px; box-sizing: content-box; border-right: 1px solid rgba(240,238,234,.45); }
  .nameplate-text { min-width: 0; }
  .nameplate-handle { margin-top: 1px; color: #c5c5c5; font-size: .5rem; line-height: 1.1; letter-spacing: .08em; }
  .name {
    font-family: 'Pirata One', 'Fraunces', serif;
    font-weight: 400;
    font-size: 1.15rem;
    line-height: 1.05;
    text-shadow: 0 0 3px rgba(255,255,255,.35);
    letter-spacing: -0.005em;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .status {
    position: absolute;
    right: 3%;
    bottom: 3%;
    z-index: 2;
    width: 22%;
    height: 22%;
    border: 4px solid #383838;
    border-radius: 50%;
    background: var(--status-offline);
  }
  .status.online { background: var(--status-online); }
  .status.idle { background: var(--status-idle); }
  .status.dnd { background: var(--status-dnd); }
  .status::after { content: ''; position: absolute; background: #383838; }
  .status.idle::after { width: 75%; height: 75%; top: -12%; left: -12%; border-radius: 50%; }
  .status.dnd::after { width: 65%; height: 20%; left: 17.5%; top: 40%; border-radius: 2px; }
  .status.offline::after { inset: 25%; border-radius: 50%; }
  .quiet {
    position: relative;
    width: fit-content;
    max-width: 100%;
    box-sizing: border-box;
    margin: 22px 0 2px;
    padding: 13px 19px;
    border: 1px solid rgba(240, 238, 234, .23);
    border-radius: 23px 25px 25px 9px;
    background: linear-gradient(135deg, rgba(78, 78, 78, .8), rgba(35, 35, 35, .65));
    box-shadow: 0 6px 18px rgba(0, 0, 0, .15), inset 0 1px 0 rgba(240, 238, 234, .06);
    color: var(--ink);
    font-size: .95rem;
    line-height: 1.6;
    font-style: italic;
    font-family: 'Fraunces', serif;
    overflow-wrap: anywhere;
  }
  .quiet::before,
  .quiet::after {
    content: '';
    position: absolute;
    border: 1px solid rgba(240, 238, 234, .23);
    border-radius: 50%;
    background: #414141;
    pointer-events: none;
  }
  .quiet::before { width: 8px; height: 8px; top: -14px; left: 25px; }
  .quiet::after { width: 4px; height: 4px; top: -23px; left: 17px; }
  .quiet-text { margin: 0; }

  /* ---- activity card (mirrors Discord's native embed) ---- */
  .dc-card {
    border-top: 1px solid var(--hairline);
    padding-top: 18px;
  }
  .dc-card + .dc-card { margin-top: 10px; }
  .dc-list { display: flex; flex-direction: column; gap: 10px; }

  .dc-inner {
    background: #464646;
    border-radius: 8px;
    padding: 10px;
  }

  .dc-head-line { display:flex; align-items:center; gap:6px; }
  .vscode-icon { width:56px; height:56px; flex:0 0 56px; display:inline-flex; align-items:center; justify-content:center; color:#f0eeea; }
  .vscode-icon svg { width:100%; height:100%; display:block; }

  .dc-head {
    font-size: 0.6rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .dc-body { display: flex; gap: 10px; }
  .dc-art-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .vscode-art-wrap { display:flex; align-items:center; justify-content:center; background:transparent; }
  .dc-art {
    width: 56px; height: 56px; border-radius: 4px;
    object-fit: cover; display: block;
    background: rgba(255,255,255,0.06);
  }
  .dc-badge {
    position: absolute; right: -4px; bottom: -4px;
    width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid #464646;
    object-fit: cover;
    background: #404040;
  }
  .dc-info { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .dc-title {
    color: var(--ink); font-weight: 600; font-size: 0.7rem; line-height: 1.35;
    white-space: normal; overflow-wrap: break-word; word-break: break-word;
  }
  .dc-subtitle {
    color: var(--muted); font-size: 0.64rem; line-height: 1.35;
    white-space: normal; overflow-wrap: break-word; word-break: break-word;
  }
  .dc-progress { margin-top: 8px; }
  .dc-track {
    height: 4px; background: rgba(255,255,255,0.16); border-radius: 2px; overflow: hidden;
  }
  .dc-fill { height: 100%; width: 0%; background: var(--ink); border-radius: 2px; }
  .dc-times {
    display: flex; justify-content: space-between;
    font-size: 0.58rem; color: var(--muted); margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .dc-elapsed {
    margin-top: 8px;
    font-size: 0.58rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }


  /* ---- personal favorites ---- */
  .favorites {
    margin-top: 22px;
    border: 1px solid rgba(240, 238, 234, .3);
    border-radius: 12px;
    padding: 18px 14px;
    background: rgba(255, 255, 255, .08);
    box-shadow: inset 0 0 0 3px rgba(240, 238, 234, .025);
  }
  .favorite-title {
    margin: 0 0 12px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.25rem;
    color: var(--ink);
  }
  .favorite-list {
    display: grid;
    gap: 7px;
  }
  .favorite-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 11px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: rgba(255,255,255,.08);
    color: var(--ink);
    text-decoration: none;
    font-size: .7rem;
    transition: .18s ease;
  }
  a.favorite-item:hover {
    background: rgba(240,238,234,.08);
    border-color: rgba(240,238,234,.32);
    transform: translateX(2px);
  }
  .favorite-num {
    width: 24px;
    color: var(--muted);
    font-size: .58rem;
    flex: 0 0 24px;
  }
  .favorite-name {
    min-width: 0;
    flex: 1;
    line-height: 1.35;
  }
  .favorite-sub {
    display: block;
    color: var(--muted);
    font-size: .58rem;
    margin-top: 2px;
  }
  .favorite-arrow {
    color: var(--muted);
    font-size: .75rem;
  }


  .favorite-game-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }
  .favorite-game {
    text-decoration: none;
    color: inherit;
    position: relative;
    display: flex;
    align-items: flex-end;
    min-height: 112px;
    overflow: hidden;
    padding: 0;
    border: 1px solid var(--hairline);
    border-radius: 9px;
    background: #383838;
    color: var(--ink);
    text-decoration: none;
  }
  .favorite-game img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .78;
    transition: transform .25s ease, opacity .25s ease;
  }
  .favorite-game::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 28%, rgba(5,5,5,.92) 100%);
  }
  .favorite-game:hover img { transform: scale(1.06); opacity: .92; }
  .favorite-game-label {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 34px 11px 10px;
    font-family: 'Fraunces', serif;
    font-size: .88rem;
    font-weight: 600;
    line-height: 1.2;
  }
  .favorite-game-label small {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: .57rem;
    font-weight: 400;
  }
  .favorite-song-list {
    display: grid;
    gap: 8px;
  }
  .favorite-song {
    overflow: hidden;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: rgba(255,255,255,.08);
  }
  .favorite-song iframe {
    display: block;
    width: 100%;
    height: 80px;
    border: 0;
  }
  @media (max-width: 520px) {
    .wrap {
      padding: 76px max(12px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .mast { margin-bottom: 24px; }
    .sub { font-size: .8rem; }
    .banner { margin: 14px 12px 0; }
    .banner-image { border-radius: 20px; }
    .frame-body { padding: 16px 12px; }
    .who {
      display: grid;
      grid-template-columns: clamp(76px, 22vw, 104px) minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      margin-top: -44px;
      margin-bottom: 20px;
    }
    .avatar-wrap { width: 100%; height: auto; aspect-ratio: 1; }
    .who-info { transform: none; padding: 44px 0 0; }
    .nameplate { min-width: 0; padding: 5px 12px; margin-left: 4px; margin-right: 0; }
    .nameplate-content { gap: 5px; }
    .name { font-size: clamp(.95rem, 4.3vw, 1.15rem); }
    .nameplate-discord { width: 16px; height: 16px; flex-basis: 16px; padding-right: 4px; }
    .favorites { margin-top: 18px; padding: 16px 10px; }
    .favorite-title { font-size: 1.15rem; overflow-wrap: anywhere; }
    .favorite-game-list { grid-template-columns: 1fr; }
    .favorite-game { min-height: 132px; }
    .dc-head { overflow-wrap: anywhere; }
    .dc-body { gap: 8px; }
    .dc-art-wrap, .dc-art { width: 48px; height: 48px; }
    .vscode-icon { width: 48px; height: 48px; flex-basis: 48px; }
    #return-to-choice { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); min-height: 40px; }
  }
  @media (max-width: 350px) {
    .who { gap: 8px; }
    .nameplate { padding-inline: 9px; }
    .nameplate-discord { width: 14px; height: 14px; flex-basis: 14px; }
  }
</style>

</head>
<body>
<button id="return-to-choice" type="button" onclick="returnToChoice()">← return</button>
<div class="wrap">
  <div class="mast">
    <h1>Watchly</h1>
    <p class="sub">Behold what presently unfolds upon the screen.</p>
  </div>

  <div class="frame">
    <div class="banner">
      <img class="banner-image" src="assets/watchly-gothic.jpg" alt="Black-and-white Gothic cathedral interior">
      <svg class="banner-ornament" viewBox="0 0 735 260" preserveAspectRatio="none" fill="none" stroke="currentColor" aria-hidden="true">
        <defs>
          <g id="banner-filigree" stroke-width="1.2">
            <path d="M0,-23 C3,-9 9,-6 18,-4 C8,0 4,7 0,17 C-4,7 -8,0 -18,-4 C-9,-6 -3,-9 0,-23Z"/>
            <path d="M0,-15 L4,-3 0,9 -4,-3Z M-30,0 Q-17,-12 0,17 Q17,-12 30,0 M-22,-7 Q-10,-8 0,4 Q10,-8 22,-7"/>
          </g>
          <g id="banner-corner" stroke-width="1.1">
            <path d="M0,45 Q0,0 45,0 M5,34 Q17,31 11,18 Q25,25 26,9 M11,18 L5,10 M26,9 L31,3"/>
            <path d="M10,25 L13,31 19,34 13,37 10,43 7,37 1,34 7,31Z"/>
          </g>
        </defs>
        <rect x="8" y="12" width="719" height="236" rx="34" stroke-width="1.6"/>
        <rect x="13" y="17" width="709" height="226" rx="30" stroke-width=".7"/>
        <rect x="18" y="22" width="699" height="216" rx="26" stroke-width="1"/>
        <use href="#banner-corner" transform="translate(8 12)"/>
        <use href="#banner-corner" transform="translate(727 12) scale(-1 1)"/>
        <use href="#banner-corner" transform="translate(8 248) scale(1 -1)"/>
        <use href="#banner-corner" transform="translate(727 248) scale(-1 -1)"/>
        <use href="#banner-filigree" transform="translate(367.5 15)"/>
        <use href="#banner-filigree" transform="translate(367.5 245) scale(.65 -.65)"/>
      </svg>
    </div>
    <div class="frame-body">
      <div class="who">
        <div class="avatar-wrap">
          <img class="avatar" id="avatar" src="" alt="">
          <img class="avatar-decoration" id="avatarDecoration" src="" alt="" style="display:none;">
          <span class="status offline" id="status" role="img" aria-label="Offline" title="Offline"></span>
        </div>
        <div class="who-info">
          <div class="nameplate">
            <svg class="nameplate-crest top" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width=".8" aria-hidden="true"><path id="nameplate-crest-shape" d="M12 1 Q13 6 18 7 Q14 9 12 13 Q10 9 6 7 Q11 6 12 1Z M12 4 L14 7 12 10 10 7Z M1 10 Q5 4 9 10 M15 10 Q19 4 23 10"/></svg>
            <svg class="nameplate-crest bottom" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width=".8" aria-hidden="true"><use href="#nameplate-crest-shape"/></svg>
            <svg class="nameplate-ornament left" viewBox="0 0 26 38" fill="none" stroke="currentColor" aria-hidden="true"><path id="nameplate-flourish" d="M13 1 Q12 12 2 19 Q12 26 13 37 Q15 25 24 19 Q15 12 13 1Z M13 8 L17 19 13 30 9 19Z M2 19 H24 M5 9 Q22 12 19 19 Q22 26 5 29"/></svg>
            <div class="nameplate-content">
              <svg class="nameplate-discord" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Discord"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515c-.211.375-.457.88-.626 1.281a18.27 18.27 0 0 0-5.416 0 12.64 12.64 0 0 0-.635-1.281A19.736 19.736 0 0 0 3.87 4.37C.78 8.95-.058 13.417.36 17.82a19.9 19.9 0 0 0 5.993 3.03c.485-.66.916-1.36 1.287-2.096a12.94 12.94 0 0 1-2.027-.987c.17-.124.337-.253.498-.386 3.91 1.807 8.158 1.807 12.022 0 .163.133.33.262.498.386-.644.388-1.324.72-2.03.988.372.735.802 1.436 1.287 2.095a19.85 19.85 0 0 0 6.002-3.03c.49-5.104-.838-9.53-3.573-13.45ZM8.02 15.125c-1.174 0-2.137-1.078-2.137-2.4s.943-2.402 2.137-2.402c1.195 0 2.158 1.08 2.137 2.402 0 1.322-.942 2.4-2.137 2.4Zm7.9 0c-1.174 0-2.137-1.078-2.137-2.4s.943-2.402 2.137-2.402c1.195 0 2.158 1.08 2.137 2.402 0 1.322-.942 2.4-2.137 2.4Z"/></svg>
              <div class="nameplate-text">
                <div class="name" id="name">—</div>
                <div class="nameplate-handle">3xd57v</div>
              </div>
            </div>
            <svg class="nameplate-ornament right" viewBox="0 0 26 38" fill="none" stroke="currentColor" aria-hidden="true"><use href="#nameplate-flourish"/></svg>
          </div>
        </div>
      </div>
      <div class="last-online" id="lastOnlineBox" hidden>
        <span id="lastOnline">Checking status…</span>
        <span class="last-online-detail" id="lastOnlineDetail"></span>
      </div>
      <div id="activityBlock"></div>
    </div>
  </div>

      <div class="favorites">
        <h2 class="favorite-title">favorite games</h2>
        <div class="favorite-game-list">
          <a class="favorite-game" href="https://playvalorant.com/en-us/" target="_blank" rel="noopener noreferrer"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Valorant_logo_-_pink_color_version_%28cropped%29.png" alt="VALORANT" loading="eager"><span class="favorite-game-label">VALORANT</span></a>

          <a class="favorite-game" href="https://www.minecraft.net/en-us" target="_blank" rel="noopener noreferrer"><img src="https://ethlan.fr/img/jeux/121.jpg" alt="Minecraft"><span class="favorite-game-label">Minecraft</span></a>
          <a class="favorite-game" href="https://www.hollowknight.com/" target="_blank" rel="noopener noreferrer"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/367520/header.jpg" alt="Hollow Knight"><span class="favorite-game-label">Hollow Knight</span></a>

        <div class="favorite-song-list">
          <div class="favorite-song"><iframe src="https://open.spotify.com/embed/track/7kYkPZeXnaekps7wVwkEPN?utm_source=generator&theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
          <div class="favorite-song"><iframe src="https://open.spotify.com/embed/track/1trLEhC9nDvvj36MfnlwcJ?utm_source=generator&theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
          <div class="favorite-song"><iframe src="https://open.spotify.com/embed/track/6rY5FAWxCdAGllYEOZMbjW?utm_source=generator&theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
          <div class="favorite-song"><iframe src="https://open.spotify.com/embed/track/4knNlB73rkLODZU03Xjx7x?utm_source=generator&theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
          <div class="favorite-song"><iframe src="https://open.spotify.com/embed/track/40x8vMUHIjqd2A5EtHEvAb?utm_source=generator&theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
          <div class="favorite-song"><iframe src="https://open.spotify.com/embed/track/709p9UGPAuyImWf1Z3vjRo?utm_source=generator&theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>

      <path d="M0,7 C4,1 7,6 12,3 C17,6 20,1 24,7 C18,5 15,9 12,6 C9,9 6,5 0,7 Z"></path>

<script src="watchly-settings.js"></script>
<script>
  // --- the only thing you need to set ---
  const DISCORD_USER_ID = '1067928829148020736';
  // ----------------------------------------

  const avatarEl = document.getElementById('avatar');
  const avatarDecorationEl = document.getElementById('avatarDecoration');
  const nameEl = document.getElementById('name');
  const statusEl = document.getElementById('status');
  const activityBlockEl = document.getElementById('activityBlock');

  let elapsedTimer = null;
  const lastOnlineBoxEl = document.getElementById('lastOnlineBox');
  const lastOnlineEl = document.getElementById('lastOnline');
  const lastOnlineDetailEl = document.getElementById('lastOnlineDetail');
  let lastOnlineAt = null;
  let presenceStatus = null;
  let livePresence = false;
  let receivedSocketPresence = false;
  let historyState = 'loading';
  const lastOnlineKey = `watchly:last-online:${DISCORD_USER_ID}`;
  let browserLastOnlineAt = null;
  try {
    const saved = Number(localStorage.getItem(lastOnlineKey));
    if (Number.isFinite(saved) && saved > 0 && saved <= Date.now()) browserLastOnlineAt = saved;
  } catch (_) {}

  function rememberBrowserOnline() {
    browserLastOnlineAt = Date.now();
    try { localStorage.setItem(lastOnlineKey, String(browserLastOnlineAt)); } catch (_) {}
  }

  async function loadSharedHistory() {
    try {
      const response = await fetch('/api/last-online', { cache: 'no-store' });
      if (!response.ok) throw new Error('Shared history unavailable');
      const history = await response.json();
      if (history.userId !== DISCORD_USER_ID ||
          !(history.lastOnlineAt === null || (Number.isFinite(history.lastOnlineAt) && history.lastOnlineAt > 0))) {
        throw new Error('Invalid shared history');
      }
      lastOnlineAt = Number.isFinite(history.lastOnlineAt) ? history.lastOnlineAt : null;
      historyState = history.trackingAvailable === false ? 'unavailable' : 'ready';
    } catch (_) {
      historyState = 'unavailable';
    }
    renderLastOnline();
  }

  function offlineDuration(timestamp) {
    const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
    const days = Math.floor(seconds / 86400);
    const hours = Math.floor(seconds % 86400 / 3600);
    const minutes = Math.floor(seconds % 3600 / 60);
    return [days && `${days}d`, (days || hours) && `${hours}h`,
      (days || hours || minutes) && `${minutes}m`, `${seconds % 60}s`].filter(Boolean).join(' ');
  }

  function renderLastOnline() {
    if (historyState === 'unavailable' && browserLastOnlineAt &&
        (!lastOnlineAt || browserLastOnlineAt > lastOnlineAt)) {
      lastOnlineAt = browserLastOnlineAt;
    }
    lastOnlineBoxEl.hidden = !livePresence || presenceStatus !== 'offline';
    if (!presenceStatus) {
      lastOnlineEl.textContent = 'Status unavailable';
      lastOnlineDetailEl.textContent = 'Waiting for a live status update.';
    } else if (!livePresence) {
      lastOnlineEl.textContent = 'Reconnecting to live status…';
      lastOnlineDetailEl.textContent = lastOnlineAt
        ? `Last observed online: ${new Date(lastOnlineAt).toLocaleString()}`
        : 'Last online has not been recorded yet.';
    } else if (presenceStatus !== 'offline') {
      lastOnlineEl.textContent = 'Last online: now';
      lastOnlineDetailEl.textContent = { online: 'Currently online', idle: 'Currently idle', dnd: 'Do Not Disturb' }[presenceStatus];
    } else if (lastOnlineAt) {
      lastOnlineEl.textContent = `Last seen online: ${offlineDuration(lastOnlineAt)} ago`;
      lastOnlineDetailEl.textContent = `Last seen: ${new Date(lastOnlineAt).toLocaleString()}`;
    } else {
      lastOnlineEl.textContent = 'Offline · Last online unknown';
      lastOnlineDetailEl.textContent = historyState === 'loading'
        ? 'Loading saved history…'
        : historyState === 'unavailable'
          ? 'Shared tracking is unavailable.'
          : 'No online session has been recorded yet.';
    }
  }

  function updatePresence(status) {
    if (!['online', 'idle', 'dnd', 'offline'].includes(status)) return;
    if (status !== 'offline') rememberBrowserOnline();
    if (status !== presenceStatus) loadSharedHistory();
    presenceStatus = status;
    livePresence = true;
    renderLastOnline();
  }

  // This timer is independent of activity timers, including when no activity exists.
  setInterval(() => {
    renderLastOnline();
  }, 1000);

  loadSharedHistory();
  setInterval(loadSharedHistory, 30000);

  function avatarUrl(user) {
    if (!user.avatar) return `https://cdn.discordapp.com/embed/avatars/${(Number(user.discriminator) || 0) % 5}.png`;
    const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
    return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
  }


  function avatarDecorationUrl(user) {
    const deco = user.avatar_decoration_data;
    if (!deco || !deco.asset) return null;
    return `https://cdn.discordapp.com/avatar-decoration-presets/${deco.asset}.png?size=160&passthrough=true`;
  }

  function fmtElapsed(startMs) {
    const s = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')} elapsed`
      : `${m}:${String(sec).padStart(2, '0')} elapsed`;
  }

  function fmtTime(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, '0')}`;
  }

  // Resolves a Discord rich-presence asset key into an actual image URL.
  // Handles every format Lanyard/Discord hand back: full URLs some RPC
  // integrations already provide, "mp:"/"external/" media-proxy paths,
  // "spotify:" album art ids, and raw app-asset ids.
  function resolveImage(key, applicationId) {
    if (!key) return null;
    if (key.startsWith('http://') || key.startsWith('https://')) return key;
    if (key.startsWith('mp:')) return `https://media.discordapp.net/${key.slice(3)}`;
    if (key.startsWith('external/')) return `https://media.discordapp.net/${key}`;
    if (key.startsWith('spotify:')) return `https://i.scdn.co/image/${key.slice(8)}`;
    if (applicationId) return `https://cdn.discordapp.com/app-assets/${applicationId}/${key}.png`;
    return null;
  }

  // Native Discord Watching activities, plus video integrations that publish
  // their rich presence as Playing. Do not infer video from arbitrary titles
  // (a game, editor or music track can also contain the word "watching").
  function isWatchingActivity(activity) {
    if (activity.type === 3) return true;
    if (activity.type !== 0) return false;
    const videoApps = /^(?:fukurubasdomain|YouTube(?: Together)?|Netflix|Crunchyroll|Disney\+|Disney Plus|(?:Amazon )?Prime Video|Hulu|HBO Max|Max|Apple TV\+?|Plex|Jellyfin|Stremio|VLC(?: media player)?|mpv|PotPlayer)$/i;
    const details = [activity.details, activity.state]
      .filter(value => typeof value === 'string' && value.trim());
    return videoApps.test(String(activity.name || '').trim()) &&
      details.length > 0 &&
      !details.every(value => /^(?:browsing|in (?:the )?(?:menus?|library)|idle)(?:\b|$)/i.test(value.trim()));
  }

  function render(data) {
    if (!data || !data.discord_user) return;

    nameEl.textContent = data.discord_user.global_name || data.discord_user.username;
    const discordStatus = data.discord_status;
    updatePresence(discordStatus);
    const status = ['online', 'idle', 'dnd'].includes(discordStatus) ? discordStatus : 'offline';
    const statusLabel = { online: 'Online', idle: 'Idle', dnd: 'Do Not Disturb', offline: 'Offline' }[status];
    statusEl.className = 'status ' + status;
    statusEl.setAttribute('aria-label', statusLabel);
    statusEl.title = statusLabel;
    avatarEl.src = avatarUrl(data.discord_user);

    const decoUrl = avatarDecorationUrl(data.discord_user);
    if (decoUrl) {
      avatarDecorationEl.src = decoUrl;
      avatarDecorationEl.style.display = 'block';
    } else {
      avatarDecorationEl.style.display = 'none';
      avatarDecorationEl.removeAttribute('src');
    }


    clearInterval(elapsedTimer);

    // Render every active activity instead of selecting only the first one.
    // Discord custom status (type 4) is excluded because it is not a rich activity.
    // Group duplicate activities by game name and keep the icon-bearing entry.
    const activityMap = new Map();

    (data.activities || []).forEach((a) => {
      if (a.type === 4) return;
      if (data.listening_to_spotify && data.spotify && a.name === 'Spotify') return;

      const nameKey = String(a.name || '').trim().toLowerCase();
      const key = nameKey || (a.application_id ? `app:${a.application_id}` : null);
      if (!key) return;

      const existing = activityMap.get(key);
      if (!existing) {
        activityMap.set(key, a);
        return;
      }

      const existingAssets = existing.assets || {};
      const currentAssets = a.assets || {};
      const existingHasIcon = Boolean(existingAssets.large_image || existingAssets.small_image);
      const currentHasIcon = Boolean(currentAssets.large_image || currentAssets.small_image);

      // When the same game is reported twice, keep the entry with the game icon.
      // This removes the plain VALORANT entry and keeps the full icon-bearing one.
      if (!existingHasIcon && currentHasIcon) {
        activityMap.set(key, a);
      }
    });

    const activities = Array.from(activityMap.values());
    const cards = [];
    const timers = [];

    if (data.listening_to_spotify && data.spotify) {
      const sp = data.spotify;
      cards.push(`
        <div class="dc-card">
          <div class="dc-inner">
            <div class="dc-head">Listening to Spotify</div>
            <div class="dc-body">
              <div class="dc-art-wrap">
                <img class="dc-art" src="${escapeHtml(sp.album_art_url || '')}" alt="">
              </div>
              <div class="dc-info">
                <div class="dc-title">${escapeHtml(sp.song)}</div>
                <div class="dc-subtitle">${escapeHtml(sp.artist)}</div>
              </div>
            </div>
            <div class="dc-progress">
              <div class="dc-track"><div class="dc-fill" id="spFill"></div></div>
              <div class="dc-times"><span id="spElapsed">0:00</span><span id="spTotal">0:00</span></div>
            </div>
          </div>
        </div>`);

      const start = sp.timestamps && sp.timestamps.start;
      const end = sp.timestamps && sp.timestamps.end;
      if (start && end) {
        timers.push(() => {
          const now = Date.now();
          const fill = document.getElementById('spFill');
          const elapsed = document.getElementById('spElapsed');
          const total = document.getElementById('spTotal');
          if (!fill || !elapsed || !total) return;
          const pct = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
          fill.style.width = pct + '%';
          elapsed.textContent = fmtTime(now - start);
          total.textContent = fmtTime(end - start);
        });
      }
    }

    activities.forEach((activity, index) => {
      const assets = activity.assets || {};
      const largeUrl = resolveImage(assets.large_image, activity.application_id);
      const smallUrl = resolveImage(assets.small_image, activity.application_id);

      // Discord shows details/state as the body copy and keeps the activity name in
      // the header line; fall back to the name itself when neither is set.
      const lines = [activity.details, activity.state].filter(Boolean);
      const titleText = lines[0] || activity.name || 'Activity';
      const subtitleText = lines[1] || null;
      const watching = isWatchingActivity(activity);
      // Preserve the provider's exact title and season/episode text; missing
      // metadata stays missing rather than guessing an episode number.
      const headerText = watching
        ? `${data.discord_user.global_name || data.discord_user.username || 'User'} is now watching:`
        : activity.name || 'Activity';
      const elapsedId = `elapsedLine-${index}`;

      cards.push(`
        <div class="dc-card">
          <div class="dc-inner">
            <div class="dc-head">${escapeHtml(headerText)}</div>
            <div class="dc-body">
              ${activity.name === 'Visual Studio Code' || activity.name === 'VS Code' ? `
                <div class="dc-art-wrap vscode-art-wrap">
                  <span class="vscode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.8 2.1 9.2 8.9 5.5 6.1 3 7.7v8.6l2.5 1.6 3.7-2.8 8.6 6.8L22 20.1V3.9l-4.2-1.8ZM5.2 15.3V8.7l4 3.3-4 3.3Zm5.8-3.3 6.8-5.4v10.8L11 12Z"/></svg></span>
                </div>` : (largeUrl ? `
                <div class="dc-art-wrap">
                  <img class="dc-art" src="${escapeHtml(largeUrl)}" alt="">
                  ${smallUrl ? `<img class="dc-badge" src="${escapeHtml(smallUrl)}" alt="">` : ''}
                </div>` : '')}
              <div class="dc-info">
                <div class="dc-title">${escapeHtml(titleText)}</div>
                ${subtitleText ? `<div class="dc-subtitle">${escapeHtml(subtitleText)}</div>` : ''}
              </div>
            </div>
            <div class="dc-elapsed" id="${elapsedId}"></div>
          </div>
        </div>`);

      const start = activity.timestamps && activity.timestamps.start;
      if (start) {
        timers.push(() => {
          const el = document.getElementById(elapsedId);
          if (el) el.textContent = fmtElapsed(start);
        });
      }
    });

    if (!cards.length) {
      const idleMessage = typeof window.watchlySettings?.idleMessage === 'string'
        ? window.watchlySettings.idleMessage
        : 'Not doing much right now.';
      activityBlockEl.innerHTML = `<div class="quiet">
        <p class="quiet-text">${escapeHtml(idleMessage)}</p>
      </div>`;
      return;
    }

    activityBlockEl.innerHTML = `<div class="dc-list">${cards.join('')}</div>`;
    timers.forEach((tick) => tick());
    if (timers.length) elapsedTimer = setInterval(() => timers.forEach((tick) => tick()), 1000);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Initial paint from the REST endpoint so there's no blank flash while
  // the socket connects.
  fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`)
    .then((r) => r.json())
    .then((j) => { if (j.success && !receivedSocketPresence) render(j.data); })
    .catch(() => {});

  // Live updates via Lanyard's WebSocket — this is the same gateway
  // connection style Discord's own clients use to receive presence pushes.
  let ws, heartbeatTimer;

  function connect() {
    ws = new WebSocket('wss://api.lanyard.rest/socket');

    ws.onopen = () => {
      ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_USER_ID } }));
    };

    ws.onmessage = (msg) => {
      const payload = JSON.parse(msg.data);
      if (payload.op === 1) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: 3 }));
        }, payload.d.heartbeat_interval);
      }
      if (payload.op === 0 && (payload.t === 'INIT_STATE' || payload.t === 'PRESENCE_UPDATE')) {
        receivedSocketPresence = true;
        render(payload.d);
      }
    };

    ws.onclose = () => {
      livePresence = false;

      renderLastOnline();
      clearInterval(heartbeatTimer);
      setTimeout(connect, 3000); // reconnect on drop
    };
    ws.onerror = () => ws.close();
  }

  connect();
</script>
