<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fukuruba choose your path</title>
<link rel="stylesheet" href="style.css">
<script>
  // Play the cinematic intro once per browsing session — if it's
  // already been seen (e.g. we're back here via the "← return"
  // button on socials.html/watchly.html), skip straight to the
  // chooser. Runs synchronously in <head> so the intro never
  // flashes on screen before being hidden.
  if (sessionStorage.getItem('fukuruba-intro-seen')) {
    document.documentElement.classList.add('skip-intro');
  } else {
    sessionStorage.setItem('fukuruba-intro-seen', '1');
  }
</script>
<style>
  html,body{margin:0;min-height:100%;background:#050505;color:#f0eeea}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    place-items:center;
    overflow-x:hidden;
    padding:24px 0;
    font-family:'IBM Plex Mono','SFMono-Regular',Consolas,Menlo,monospace;
    background:#050505;
  }

  .chooser{
    position:relative;
    z-index:2;
    width:min(560px,calc(100vw - 40px));
    padding:42px 34px 36px;
    text-align:center;
    border:1px solid rgba(240,238,234,.16);
    background:rgba(5,5,5,.78);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 30px 80px rgba(0,0,0,.7);
    margin-bottom: 50px
  }

  .eyebrow{
    margin:0 0 18px;
    color:#9c9c9c;
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(2.7rem,9vw,4.8rem);
    font-weight:400;
    font-style:italic;
    letter-spacing:-.04em;
  }

  .prompt{
    margin:16px auto 30px;
    max-width:38ch;
    color:#c9c5bd;
    font-size:.86rem;
    line-height:1.7;
  }

  .prompt span{color:#f0eeea}

  .choices{display:grid;gap:10px}

  button{
    appearance:none;
    width:100%;
    border:1px solid rgba(240,238,234,.18);
    background:rgba(240,238,234,.045);
    color:#f0eeea;
    padding:17px 18px;
    font:500 .78rem/1.2 'IBM Plex Mono','SFMono-Regular',Consolas,Menlo,monospace;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .25s ease,border-color .25s ease,transform .25s ease;
  }

  button:hover{
    background:rgba(240,238,234,.10);
    border-color:rgba(240,238,234,.38);
    transform:translateY(-1px);
  }

  button:focus-visible{
    outline:2px solid #f0eeea;
    outline-offset:3px;
  }

  button small{
    display:block;
    margin-top:7px;
    color:#8e8e8e;
    font-size:.62rem;
    letter-spacing:.02em;
    text-transform:none;
    font-weight:400;
  }

  .backdrop{
    position:fixed;
    inset:-8%;
    z-index:0;
    background:
      linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.82)),
      url("assets/backdrop-photo.jpg") center/cover no-repeat;
    filter:grayscale(1) contrast(1.05);
    transform:scale(1.04);
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:.09;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }

  #page{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    border:0;
    width:100%;
    height:100%;
    background:#050505;
  }

  @media(max-width:520px){
    .chooser{padding:34px 22px 28px}
  }

  /* ───────── fukuruba cinematic opening sequence ───────── */
  html.skip-intro .intro{
    display:none;
  }

  .intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 48%,rgba(240,238,234,.075),transparent 24%),
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.028),transparent 54%),
      #050505;
    color:#f0eeea;
    pointer-events:auto;
    isolation:isolate;
    animation:introExit 1.45s cubic-bezier(.76,0,.24,1) 9s forwards;
  }

  .intro::before,
  .intro::after{
    content:"";
    position:absolute;
    left:50%;
    width:min(900px,88vw);
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(240,238,234,.48),transparent);
    transform:translateX(-50%) scaleX(0);
    transform-origin:center;
    box-shadow:0 0 14px rgba(240,238,234,.08);
  }

  .intro::before{
    top:calc(50% - 118px);
    animation:introLine 1.25s cubic-bezier(.16,1,.3,1) .55s forwards;
  }

  .intro::after{
    top:calc(50% + 118px);
    animation:introLine 1.25s cubic-bezier(.16,1,.3,1) .78s forwards;
  }

  .intro-corners{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .intro-corners span{
    position:absolute;
    width:105px;
    height:105px;
    opacity:0;
    animation:cornerIn 1.15s cubic-bezier(.16,1,.3,1) .7s forwards;
  }

  .intro-corners span::before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    border:1px solid rgba(240,238,234,.16);
    transform:rotate(45deg);
    animation:cornerDiamond 4.2s ease-in-out 2s infinite;
  }

  .intro-corners span::after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    border:1px solid rgba(240,238,234,.55);
    transform:rotate(45deg);
    animation:cornerPulse 2.6s ease-in-out 1.8s infinite;
  }

  .intro-corners span:nth-child(1){
    top:30px;left:30px;
    border-top:1px solid rgba(240,238,234,.62);
    border-left:1px solid rgba(240,238,234,.62);
  }
  .intro-corners span:nth-child(1)::before{right:-9px;bottom:-9px}
  .intro-corners span:nth-child(1)::after{right:-3px;bottom:-3px}

  .intro-corners span:nth-child(2){
    top:30px;right:30px;
    border-top:1px solid rgba(240,238,234,.62);
    border-right:1px solid rgba(240,238,234,.62);
  }
  .intro-corners span:nth-child(2)::before{left:-9px;bottom:-9px}
  .intro-corners span:nth-child(2)::after{left:-3px;bottom:-3px}

  .intro-corners span:nth-child(3){
    bottom:30px;left:30px;
    border-bottom:1px solid rgba(240,238,234,.62);
    border-left:1px solid rgba(240,238,234,.62);
  }
  .intro-corners span:nth-child(3)::before{right:-9px;top:-9px}
  .intro-corners span:nth-child(3)::after{right:-3px;top:-3px}

  .intro-corners span:nth-child(4){
    bottom:30px;right:30px;
    border-bottom:1px solid rgba(240,238,234,.62);
    border-right:1px solid rgba(240,238,234,.62);
  }
  .intro-corners span:nth-child(4)::before{left:-9px;top:-9px}
  .intro-corners span:nth-child(4)::after{left:-3px;top:-3px}

  .intro-mark{
    position:relative;
    text-align:center;
    z-index:4;
    transform:translateY(22px) scale(.96);
    opacity:0;
    animation:introMark 1.45s cubic-bezier(.16,1,.3,1) 1.05s forwards;
  }

  .intro-name{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(3.8rem,12vw,8rem);
    font-weight:400;
    font-style:italic;
    letter-spacing:-.065em;
    line-height:.88;
    text-shadow:
      0 0 24px rgba(240,238,234,.08),
      0 0 70px rgba(240,238,234,.035);
    animation:nameBreath 3.8s ease-in-out 2.35s infinite;
  }

  .intro-rule{
    position:relative;
    width:0;
    height:1px;
    margin:27px auto 18px;
    background:rgba(240,238,234,.62);
    box-shadow:0 0 14px rgba(240,238,234,.12);
    animation:introRule 1.1s cubic-bezier(.16,1,.3,1) 2.05s forwards;
  }

  .intro-rule::before,
  .intro-rule::after{
    content:"";
    position:absolute;
    top:50%;
    width:6px;
    height:6px;
    border:1px solid rgba(240,238,234,.6);
    transform:translateY(-50%) rotate(45deg);
    opacity:0;
    animation:ruleMarks .7s ease 2.5s forwards;
  }
  .intro-rule::before{left:-3px}
  .intro-rule::after{right:-3px}

  .intro-sub{
    max-width:min(700px,82vw);
    margin:0 auto;
    color:#b8b3ab;
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(.72rem,1.7vw,.92rem);
    font-style:italic;
    letter-spacing:.13em;
    line-height:1.8;
    opacity:0;
    transform:translateY(10px);
    animation:introSub 1.15s ease 2.55s forwards;
  }

  .intro-glyph{
    position:absolute;
    width:255px;
    height:255px;
    border:1px solid rgba(240,238,234,.11);
    transform:rotate(45deg) scale(.52);
    opacity:0;
    z-index:1;
    box-shadow:0 0 80px rgba(240,238,234,.025);
    animation:
      glyphIn 1.7s cubic-bezier(.16,1,.3,1) .35s forwards,
      glyphFloat 6s ease-in-out 2.5s infinite;
  }

  .intro-glyph::before,
  .intro-glyph::after{
    content:"";
    position:absolute;
    inset:23px;
    border:1px solid rgba(240,238,234,.075);
  }

  .intro-glyph::after{
    inset:50%;
    width:8px;
    height:8px;
    transform:translate(-50%,-50%);
    background:#f0eeea;
    border:0;
    box-shadow:
      0 0 18px rgba(240,238,234,.32),
      0 0 50px rgba(240,238,234,.12);
    animation:centerPulse 2.8s ease-in-out 2.3s infinite;
  }

  .intro-orbit{
    position:absolute;
    width:min(430px,72vw);
    height:min(430px,72vw);
    border:1px solid rgba(240,238,234,.045);
    border-radius:50%;
    opacity:0;
    z-index:2;
    animation:
      orbitIn 1.4s ease 1.35s forwards,
      orbitSpin 18s linear 2.7s infinite;
  }

  .intro-orbit::before,
  .intro-orbit::after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:#f0eeea;
    border-radius:50%;
    box-shadow:0 0 16px rgba(240,238,234,.65);
  }
  .intro-orbit::before{top:-2px;left:50%}
  .intro-orbit::after{bottom:9%;right:5%}

  .intro-aura{
    position:absolute;
    width:min(760px,94vw);
    height:min(760px,94vw);
    border-radius:50%;
    background:
      radial-gradient(circle,rgba(240,238,234,.10) 0%,rgba(240,238,234,.045) 20%,rgba(240,238,234,.018) 38%,transparent 70%);
    filter:blur(4px);
    opacity:0;
    z-index:0;
    animation:
      auraIn 2.1s ease .9s forwards,
      auraBreath 5.5s ease-in-out 2.4s infinite;
  }

  .intro-aura::after{
    content:"";
    position:absolute;
    inset:18%;
    border:1px solid rgba(240,238,234,.035);
    border-radius:50%;
    animation:auraRing 8s linear 2.5s infinite;
  }

  .intro-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:3;
  }

  .intro-stars i{
    position:absolute;
    width:2px;
    height:2px;
    background:#f0eeea;
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 11px rgba(240,238,234,.7);
    animation:starIn 1.2s ease forwards, starPulse 3.8s ease-in-out 2.2s infinite;
  }

  .intro-stars i:nth-child(1){top:21%;left:24%;animation-delay:1.35s,2.5s}
  .intro-stars i:nth-child(2){top:29%;right:22%;animation-delay:1.55s,2.9s}
  .intro-stars i:nth-child(3){bottom:27%;left:19%;animation-delay:1.75s,3.2s}
  .intro-stars i:nth-child(4){bottom:21%;right:25%;animation-delay:1.95s,2.6s}
  .intro-stars i:nth-child(5){top:16%;left:50%;animation-delay:2.1s,3.5s}
  .intro-stars i:nth-child(6){bottom:14%;left:50%;animation-delay:2.25s,3s}

  @keyframes introMark{
    0%{opacity:0;transform:translateY(22px) scale(.96);filter:blur(8px)}
    60%{opacity:1;filter:blur(0)}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }

  @keyframes introLine{
    from{transform:translateX(-50%) scaleX(0)}
    to{transform:translateX(-50%) scaleX(1)}
  }

  @keyframes introRule{
    from{width:0}
    to{width:145px}
  }

  @keyframes introSub{
    from{opacity:0;transform:translateY(10px);filter:blur(4px)}
    to{opacity:1;transform:translateY(0);filter:blur(0)}
  }

  @keyframes ruleMarks{to{opacity:1}}

  @keyframes cornerIn{
    from{opacity:0;transform:scale(.65)}
    to{opacity:1;transform:scale(1)}
  }

  @keyframes cornerPulse{
    0%,100%{opacity:.3;transform:rotate(45deg) scale(.8)}
    50%{opacity:1;transform:rotate(45deg) scale(1.18)}
  }

  @keyframes cornerDiamond{
    0%,100%{opacity:.2;transform:rotate(45deg) scale(.8)}
    50%{opacity:.7;transform:rotate(45deg) scale(1.05)}
  }

  @keyframes glyphIn{
    from{opacity:0;transform:rotate(45deg) scale(.52)}
    to{opacity:1;transform:rotate(45deg) scale(1)}
  }

  @keyframes glyphFloat{
    0%,100%{transform:rotate(45deg) scale(1) translate(0,0)}
    50%{transform:rotate(48deg) scale(1.045) translate(0,-5px)}
  }

  @keyframes centerPulse{
    0%,100%{opacity:.55;box-shadow:0 0 10px rgba(240,238,234,.2),0 0 28px rgba(240,238,234,.06)}
    50%{opacity:1;box-shadow:0 0 25px rgba(240,238,234,.5),0 0 65px rgba(240,238,234,.15)}
  }

  @keyframes nameBreath{
    0%,100%{text-shadow:0 0 24px rgba(240,238,234,.07),0 0 65px rgba(240,238,234,.025)}
    50%{text-shadow:0 0 44px rgba(240,238,234,.17),0 0 95px rgba(240,238,234,.055)}
  }

  @keyframes orbitIn{
    from{opacity:0;transform:scale(.66)}
    to{opacity:1;transform:scale(1)}
  }

  @keyframes orbitSpin{to{transform:rotate(360deg)}}

  @keyframes auraIn{
    from{opacity:0;transform:scale(.68)}
    to{opacity:1;transform:scale(1)}
  }

  @keyframes auraBreath{
    0%,100%{opacity:.52;transform:scale(1)}
    50%{opacity:.95;transform:scale(1.1)}
  }

  @keyframes auraRing{
    to{transform:rotate(360deg)}
  }

  @keyframes starIn{
    from{opacity:0;transform:scale(.15)}
    to{opacity:.72;transform:scale(1)}
  }

  @keyframes starPulse{
    0%,100%{opacity:.25;transform:scale(.8)}
    50%{opacity:1;transform:scale(2)}
  }

  @keyframes introExit{
    0%{opacity:1;clip-path:inset(0 0 0 0)}
    52%{opacity:1;clip-path:inset(0 0 100% 0)}
    82%{opacity:.98;clip-path:inset(0 0 100% 0)}
    100%{opacity:0;clip-path:inset(0 0 100% 0);visibility:hidden}
  }

  @media (prefers-reduced-motion:reduce){
    .intro,
    .intro::before,
    .intro::after,
    .intro-corners span,
    .intro-corners span::before,
    .intro-corners span::after,
    .intro-mark,
    .intro-name,
    .intro-rule,
    .intro-rule::before,
    .intro-rule::after,
    .intro-sub,
    .intro-glyph,
    .intro-glyph::after,
    .intro-orbit,
    .intro-aura,
    .intro-aura::after,
    .intro-stars i{
      animation:none !important;
    }
    .intro{
      animation:introExit .3s ease 1.4s forwards !important;
    }
    .intro-mark,
    .intro-corners span{
      opacity:1;
      transform:none;
      filter:none;
    }
    .intro::before,
    .intro::after{
      transform:translateX(-50%) scaleX(1);
    }
    .intro-rule{width:145px}
    .intro-rule::before,.intro-rule::after{opacity:1}
    .intro-sub{opacity:1;transform:none}
    .intro-glyph{opacity:1;transform:rotate(45deg)}
    .intro-orbit{opacity:1}
    .intro-aura{opacity:.7}
    .intro-stars i{opacity:.7}
  }
</style>
</head>
<body>

  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-corners">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="intro-glyph"></div>
    <div class="intro-orbit"></div>
    <div class="intro-aura"></div>
    <div class="intro-stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="intro-mark">
      <p class="intro-name">fukuruba</p>
      <div class="intro-rule"></div>
      <p class="intro-sub">Beyond the veil of the ordinary, where silence yields to wonder, let the unseen unfold before you.</p>
    </div>
  </div>

  <div class="backdrop"></div>
  <div class="grain"></div>

  <main class="chooser" id="chooser">
    <p class="eyebrow">fukuruba / watchly</p>
    <h1>Where shall you wander?</h1>
    <p class="prompt">
      <span>Choose your path.</span><br>
      Enter my social world, or take a quiet look at what unfolds upon my screen.
    </p>

    <div class="choices">
      <button type="button" onclick="window.location.href='socials.html'">
        My socials
        <small>Instagram · TikTok · Spotify · GitHub · Valorant</small>
      </button>

      <button type="button" onclick="window.location.href='watchly.html'">
        Peek at my screen
        <small>See what I am currently doing on my desktop</small>
      </button>
    </div>
  </main>
</body>
</html>
