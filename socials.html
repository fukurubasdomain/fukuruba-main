<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fukuruba socials</title>
<link rel="stylesheet" href="style.css">
<style>
  :root{
    --ink: #050505;
    --ink-2: #131313;
    --line: #2A2A2A;
    --fog: #9C9C9C;
    --paper: #F0EEEA;
    --signal: #C4302B;
  }

  html,body{
    margin:0;
    padding:0;
    background: var(--ink);
    color: var(--paper);
    min-height:100svh;
    font-family: 'IBM Plex Mono','SFMono-Regular',Consolas,Menlo,monospace;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
    background-color: var(--ink);
  }

  .ink-bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background-image: url('assets/social-bg-texture.jpg');
    background-size: cover;
    background-position: center;
  }

  .ink-bg::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 50% 35%, transparent 0%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.8) 100%);
  }

  .scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .card{
    width:100%;
    max-width: 420px;
    position:relative;
    z-index:1;
    padding: 28px 24px;
    background: rgba(5,5,5,0.55);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .profile{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .prompt-line{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--fog);
    font-size: 13px;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }

  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  .avatar{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--ink-2);
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 24px;
    box-shadow: 0 0 0 4px rgba(196,48,43,0.12);
  }

  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: clamp(28px, 7vw, 38px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px 0;
    color: var(--paper);
    min-height: 1.2em;
  }

  .cursor{
    display:inline-block;
    width: 3px;
    height: 0.9em;
    background: var(--signal);
    margin-left: 4px;
    vertical-align: -0.1em;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  .tagline{
    color: var(--fog);
    font-size: 14px;
    margin: 0 0 36px 0;
    line-height: 1.6;
  }

  .tagline span{ color: var(--signal); }

  .links{
    display:flex;
    flex-direction: column;
    gap: 12px;
  }

  .link{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration:none;
    color: var(--paper);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    position:relative;
    overflow:hidden;
    transition: border-color 0.25s ease, transform 0.15s ease, background 0.25s ease;
  }

  .link::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width: 2px;
    background: var(--signal);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s ease;
  }

  .link:hover{
    border-color: rgba(196,48,43,0.5);
    background: #1c1c1c;
    transform: translateX(3px);
  }

  .link:hover::before{
    transform: scaleY(1);
  }

  .link:active{
    transform: translateX(3px) scale(0.99);
  }

  .icon{
    width: 20px;
    height: 20px;
    flex-shrink:0;
    color: var(--fog);
    transition: color 0.25s ease;
  }

  .link:hover .icon{ color: var(--signal); }

  .label{ flex:1; min-width:0; }

  .handle-sub{
    font-size: 12px;
    color: var(--fog);
    font-weight: 400;
    display:block;
    margin-top: 2px;
  }

  .arrow{
    color: var(--line);
    font-size: 14px;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .link:hover .arrow{
    color: var(--signal);
    transform: translateX(2px);
  }

  footer{
    margin-top: 32px;
    text-align:center;
    font-size: 11px;
    color: var(--line);
    letter-spacing: 0.06em;
  }

  @media (prefers-reduced-motion: reduce){
    .dot, .cursor { animation: none; }
  }
</style>

</head>
<body>
<button id="return-to-choice" type="button" onclick="returnToChoice()">← return</button>

<div class="ink-bg"></div>

<div class="scanlines"></div>

<div class="card">
  <div class="avatar"><img id="discord-avatar" src="assets/social-avatar.jpg" alt="fukuruba"></div>

  <h1 id="handle">fukuruba<span class="cursor"></span></h1>
  <p class="tagline">you found the <span>links</span>. pick one.</p>

  <div class="links">

    <a class="link" href="https://www.instagram.com/who_is_fukuruba/" target="_blank" rel="noopener noreferrer">

  </div>

  <footer>made in the dark &middot; fukuruba.com</footer>
</div>

<script>
  // decode-in animation for the handle
  const el = document.getElementById('handle');
  const cursor = el.querySelector('.cursor');
  let finalText = "fukuruba";
  const chars = "abcdefghijklmnopqrstuvwxyz_0123456789";
  let frame = 0;
  const totalFrames = 18;

  function setDiscordDisplayName(name) {
    if (finalText === name) return;
    finalText = name;
    // Finish the initial scramble so it cannot overwrite the live name.
    frame = totalFrames;
    el.textContent = finalText;
    el.appendChild(cursor);
  }

  function scramble(){
    if(frame >= totalFrames){
      el.textContent = finalText;
      el.appendChild(cursor);
      return;
    }
    const progress = frame / totalFrames;
    const revealCount = Math.floor(progress * finalText.length);
    let out = "";
    for(let i=0;i<finalText.length;i++){
      if(i < revealCount || finalText[i] === "_" && i < revealCount + 1){
        out += finalText[i];
      } else {
        out += chars[Math.floor(Math.random()*chars.length)];
      }
    }
    el.textContent = out;
    frame++;
    requestAnimationFrame(() => setTimeout(scramble, 35));
  }

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.textContent = finalText;
    el.appendChild(cursor);
  } else {
    scramble();
  }
</script>



<script src="script.js"></script>
<script>
  (() => {
    const userId = '1067928829148020736'; // Same Discord account as Watchly.
    const avatar = document.getElementById('discord-avatar');
    const fallback = avatar.getAttribute('src');
    let timer;
    let request;

    avatar.addEventListener('error', () => {
      if (avatar.getAttribute('src') !== fallback) avatar.src = fallback;
    });

    async function refreshAvatar() {
      if (document.hidden || request) return;
      const controller = new AbortController();
      request = controller;
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`, {
          signal: controller.signal,
          cache: 'no-store'
        });
        if (!response.ok) return;
        const result = await response.json();
        const user = result.success && result.data && result.data.discord_user;
        if (!user || controller.signal.aborted) return;
        const displayName = user.global_name || user.username;
        if (displayName) {
          setDiscordDisplayName(displayName);
          avatar.alt = displayName;
        }
        let url;
        if (user.avatar) {
          const extension = user.avatar.startsWith('a_') ? 'gif' : 'png';
          url = `https://cdn.discordapp.com/avatars/${userId}/${user.avatar}.${extension}?size=128`;
        } else {
          const index = Number(user.discriminator)
            ? Number(user.discriminator) % 5
            : Number((BigInt(userId) >> 22n) % 6n);
          url = `https://cdn.discordapp.com/embed/avatars/${index}.png`;
        }
        if (avatar.getAttribute('src') !== url) avatar.src = url;
      } catch (_) {
        // Keep the current picture when Discord/Lanyard is unavailable.
      } finally {
        clearTimeout(timeout);
        if (request === controller) request = null;
      }
    }

    function stop() {
      clearInterval(timer);
      if (request) request.abort();
      request = null;
    }
    function start() {
      stop();
      if (document.hidden) return;
      refreshAvatar();
      timer = setInterval(refreshAvatar, 60000);
    }
    document.addEventListener('visibilitychange', start);
    window.addEventListener('pagehide', stop);
    window.addEventListener('pageshow', start);
    start();
  })();
</script>
</body>
